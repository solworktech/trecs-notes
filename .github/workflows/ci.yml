---
name: ci

"on":
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  # Linux is the platform this is developed and tested on. Both Ubuntu
  # releases are tried because their GTK and glibc differ.
  linux:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # xvfb: the capture tests read window properties from a real X server;
      # xclip: the selection reader the capture code shells out to
      - name: Install the build and test dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libx11-dev xvfb xclip

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o trecs-notes ./cmd/trecs-notes

      # the fallback build that needs no GTK headers (uses yad/zenity instead)
      - name: Build without GTK
        run: go build -tags nogtk -o /dev/null ./cmd/trecs-notes

      - name: Test
        run: xvfb-run -a go test ./... -v -timeout 5m

  # The macOS and Windows code is written but has not been run by its author
  # yet: these jobs are how it gets compiled and tested at all, so a red
  # result here is information, not a regression.
  other-os:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # The tray and hotkey libraries both link -lobjc, which Apple's linker
      # warns about on every build. Harmless; silenced on macOS only (the
      # flag needs Xcode 15's linker, which the runner has).
      CGO_LDFLAGS: >-
        ${{ matrix.os == 'macos-latest'
        && '-Wl,-no_warn_duplicate_libraries' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v -timeout 5m
